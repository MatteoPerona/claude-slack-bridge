# Slack app manifest for the bridge bot. Paste at api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: claude-slack-bridge
  description: Talk to a running Claude Code session from Slack
features:
  bot_user:
    display_name: claude-slack-bridge
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - users:read
      - users.profile:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
